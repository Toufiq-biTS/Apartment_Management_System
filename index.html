<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alif Apartment Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6ea;--ac:#0f766e;--ac2:#fff;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mut:#98a2b3;--bd:#2c333d;--ac:#2dd4bf;--ac2:#06201c;--bad:#f97066}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mut:#98a2b3;--bd:#2c333d;--ac:#2dd4bf;--ac2:#06201c;--bad:#f97066}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:0 0 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:8px 12px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
button.p{background:var(--ac);color:var(--ac2);border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
button.s{background:transparent;color:var(--bad);border:0;cursor:pointer}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.n{text-align:right}.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi div{flex:1;min-width:130px;background:var(--bg);border-radius:8px;padding:10px}
.kpi b{display:block;font-size:18px}.mut{color:var(--mut);font-size:13px}.bad{color:var(--bad)}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--bd);font:13px ui-monospace,monospace}
.ro .s,.ro .adm{display:none!important}
#st{font-size:13px;font-weight:400;color:var(--mut);margin-left:8px}
</style></head><body><main>
<h1>🏢 Alif Apartment Management<span id="st"></span></h1>
<div class="bar"><button class="p" id="out" onclick="logout()" style="display:none">Sign out</button><label>Month <input type="month" id="mon"></label>
<div class="tabs" id="tabs"></div></div>
<div id="view"></div>
</main>
<script>
const TABS=['Dashboard','Flats','Deposits','Expenses','Report'];
// ===== SETUP: paste your Supabase values here =====
const SUPABASE_URL='https://ghirabsnaeabmhynaobs.supabase.co';
const SUPABASE_KEY='sb_publishable_eRRWtn80qumDG47aIlDQ_Q_--I1uxza';
// ===================================================
let tab='Dashboard',D={flats:[],deposits:[],expenses:[]},ADMIN=false,IN=false,stat='';
const $=id=>document.getElementById(id);
const mon=$('mon');mon.value=new Date().toISOString().slice(0,7);mon.onchange=render;
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const flat=id=>D.flats.find(f=>f.id===id)||{no:'?',owner:'?'};
function tabsUI(){$('tabs').innerHTML=TABS.map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}
function totals(m){const dep=D.deposits.filter(x=>x.month===m),exp=D.expenses.filter(x=>x.month===m);
const td=dep.reduce((a,x)=>a+ +x.amount,0),te=exp.reduce((a,x)=>a+ +x.amount,0);
const prevD=D.deposits.filter(x=>x.month<m).reduce((a,x)=>a+ +x.amount,0),prevE=D.expenses.filter(x=>x.month<m).reduce((a,x)=>a+ +x.amount,0);
return{dep,exp,td,te,open:prevD-prevE,close:prevD-prevE+td-te}}
function render(){if(!IN)return;document.body.className=ADMIN?'':'ro';$('st').textContent=stat;tabsUI();const m=mon.value;let h='';
if(tab==='Dashboard'){h=dash(m)}
if(tab==='Flats'){h=`<div class="card adm"><h2>Add flat</h2><div class="row"><input id="fn" placeholder="Flat no."><input id="fo" placeholder="Owner name"><input id="fe" placeholder="Email"><input id="fw" placeholder="WhatsApp (e.g. 8801XXXXXXXXX)"><input id="fm" type="number" placeholder="Monthly amount"><button class="p" onclick="addFlat()">Add</button></div></div>
<div class="card sc"><table><tr><th>Flat</th><th>Owner</th><th class="adm">Email</th><th class="adm">WhatsApp</th><th class="n">Monthly</th><th></th></tr>${D.flats.map(f=>`<tr><td>${esc(f.no)}</td><td>${esc(f.owner)}</td><td class="adm">${esc(f.email)}</td><td class="adm">${esc(f.wa)}</td><td class="n">${fmt(f.monthly)}</td><td><button class="s" onclick="del('flats','${f.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan=6 class="mut">No flats yet</td></tr>'}</table></div>`}
if(tab==='Deposits'){const t=totals(m);h=`<div class="card adm"><h2>Record deposit — ${m}</h2><div class="row"><select id="df">${D.flats.map(f=>`<option value="${f.id}">${esc(f.no)} – ${esc(f.owner)}</option>`).join('')}</select><input id="da" type="number" placeholder="Amount"><input id="dd" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="p" onclick="addDep()">Save</button></div></div>
<div class="card sc"><table><tr><th>Date</th><th>Flat</th><th>Owner</th><th class="n">Amount</th><th></th></tr>${t.dep.map(x=>`<tr><td>${x.date}</td><td>${esc(flat(x.flat).no)}</td><td>${esc(flat(x.flat).owner)}</td><td class="n">${fmt(x.amount)}</td><td><button class="s" onclick="del('deposits','${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan=5 class="mut">No deposits this month</td></tr>'}<tr><th colspan=3>Total</th><th class="n">${fmt(t.td)}</th><th></th></tr></table></div>`}
if(tab==='Expenses'){const t=totals(m);h=`<div class="card adm"><h2>Record expense — ${m}</h2><div class="row"><input id="ec" placeholder="Category (e.g. Electricity)" list="cats"><datalist id="cats"><option>Electricity<option>Water<option>Security<option>Cleaning<option>Lift maintenance<option>Repairs<option>Other</datalist><input id="en" placeholder="Note"><input id="ea" type="number" placeholder="Amount"><input id="ed" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="p" onclick="addExp()">Save</button></div></div>
<div class="card sc"><table><tr><th>Date</th><th>Category</th><th>Note</th><th class="n">Amount</th><th></th></tr>${t.exp.map(x=>`<tr><td>${x.date}</td><td>${esc(x.cat)}</td><td>${esc(x.note)}</td><td class="n">${fmt(x.amount)}</td><td><button class="s" onclick="del('expenses','${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan=5 class="mut">No expenses this month</td></tr>'}<tr><th colspan=3>Total</th><th class="n">${fmt(t.te)}</th><th></th></tr></table></div>`}
if(tab==='Report'){const t=totals(m);const txt=reportText(m);
h=`<div class="card"><h2>Month-end report — ${m}</h2><div class="kpi"><div>Opening<b>${fmt(t.open)}</b></div><div>Deposits<b>${fmt(t.td)}</b></div><div>Expenses<b>${fmt(t.te)}</b></div><div>Closing balance<b class="${t.close<0?'bad':''}">${fmt(t.close)}</b></div></div></div>
<div class="card"><pre id="rt">${esc(txt)}</pre><div class="row"><button class="p" onclick="copyR()">Copy</button><button class="p" onclick="window.print()">Print / Save PDF</button></div></div>
<div class="card sc adm"><h2>Send to owners</h2><table><tr><th>Flat</th><th>Owner</th><th class="n">Paid</th><th>Share</th></tr>${D.flats.map(f=>{const p=t.dep.filter(x=>x.flat===f.id).reduce((a,x)=>a+ +x.amount,0);return`<tr><td>${esc(f.no)}</td><td>${esc(f.owner)}</td><td class="n">${fmt(p)}</td><td><button class="p" onclick="sendWA('${f.id}')">WhatsApp</button> <button class="p" onclick="sendMail('${f.id}')">Email</button></td></tr>`}).join('')||'<tr><td colspan=4 class="mut">Add flats first</td></tr>'}</table>
<p class="mut">Buttons open WhatsApp / your email app with the report pre-filled; you press Send. Fully automatic bulk sending needs a server (see chat).</p></div>`}
$('view').innerHTML=h}
const fmtK=n=>Math.abs(n)>=1000?(n/1000).toFixed(1).replace('.0','')+'k':String(Math.round(n));
function lastMonths(m,n){const [y,mo]=m.split('-').map(Number);const r=[];for(let i=n-1;i>=0;i--){const d=new Date(y,mo-1-i,1);r.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}return r}
function dash(m){const t=totals(m);const ms=lastMonths(m,6).map(k=>({k,...totals(k)}));
const avail=t.open+t.td;const pct=avail>0?Math.round(t.te/avail*100):(t.te>0?100:0);
const expected=D.flats.reduce((a,f)=>a+ +f.monthly,0);const coll=expected?Math.round(t.td/expected*100):null;
const W=640,H=220,pl=44,pb=28,pt=10,pr=10;const mx=Math.max(1,...ms.flatMap(x=>[x.td,x.te,x.close]));const mn=Math.min(0,...ms.map(x=>x.close));
const y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));const bw=(W-pl-pr)/ms.length;
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;height:auto" role="img" aria-label="Deposits, expenses and cash in hand by month">`;
for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="${pl-4}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${fmtK(v)}</text>`}
ms.forEach((x,i)=>{const cx=pl+bw*i+bw/2,w=bw*0.28;s+=`<rect x="${cx-w-1}" y="${y(x.td)}" width="${w}" height="${y(0)-y(x.td)}" fill="var(--ac)"/><rect x="${cx+1}" y="${y(x.te)}" width="${w}" height="${y(0)-y(x.te)}" fill="#e8590c"/><text x="${cx}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--mut)">${x.k.slice(2)}</text>`});
s+=`<polyline fill="none" stroke="var(--tx)" stroke-width="2" points="${ms.map((x,i)=>(pl+bw*i+bw/2)+','+y(x.close)).join(' ')}"/>`+ms.map((x,i)=>`<circle cx="${pl+bw*i+bw/2}" cy="${y(x.close)}" r="3" fill="var(--tx)"/>`).join('')+'</svg>';
const cats={};t.exp.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+ +x.amount);const ce=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
const catH=ce.map(([c,v])=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><span style="width:110px;overflow:hidden;text-overflow:ellipsis">${esc(c)}</span><div style="flex:1;background:var(--bg);border-radius:6px;height:14px"><div style="width:${v/t.te*100}%;background:#e8590c;height:14px;border-radius:6px"></div></div><span class="n" style="width:80px;text-align:right">${fmt(v)}</span></div>`).join('')||'<p class="mut">No expenses this month</p>';
const over=pct>100||t.close<0;
return `<div class="card"><h2>Cash in hand — ${m}</h2><div class="kpi"><div>Cash in hand<b class="${t.close<0?'bad':''}">${fmt(t.close)}</b></div><div>Deposits<b>${fmt(t.td)}</b></div><div>Expenses<b>${fmt(t.te)}</b></div>${coll!==null?`<div>Collection rate<b>${coll}%</b></div>`:''}</div></div>
<div class="card"><h2>Expense vs cash available</h2><p class="mut">Cash available = opening balance ${fmt(t.open)} + deposits ${fmt(t.td)} = ${fmt(avail)}</p><div style="background:var(--bg);border-radius:8px;height:22px;overflow:hidden"><div style="width:${Math.min(pct,100)}%;height:22px;background:${over?'var(--bad)':'#e8590c'}"></div></div><p>Spent <b>${fmt(t.te)}</b> = <b class="${over?'bad':''}">${pct}%</b> of cash available${over?' — over budget':''}</p></div>
<div class="card sc"><h2>Last 6 months</h2>${s}<p class="mut"><span style="color:var(--ac)">■</span> Deposits &nbsp; <span style="color:#e8590c">■</span> Expenses &nbsp; <b>●—</b> Cash in hand (closing)</p></div>
<div class="card"><h2>Expenses by category — ${m}</h2>${catH}</div>`}
function reportText(m){const t=totals(m);let s=`ALIF APARTMENT – ACCOUNTING REPORT\nMonth: ${m}\n\nOpening balance: ${fmt(t.open)}\n\nDEPOSITS\n`;
D.flats.forEach(f=>{const p=t.dep.filter(x=>x.flat===f.id).reduce((a,x)=>a+ +x.amount,0);s+=`Flat ${f.no} (${f.owner}): ${fmt(p)}${f.monthly&&p<f.monthly?`  [DUE ${fmt(f.monthly-p)}]`:''}\n`});
s+=`Total deposits: ${fmt(t.td)}\n\nEXPENSES\n`;t.exp.forEach(x=>s+=`${x.cat}${x.note?' ('+x.note+')':''}: ${fmt(x.amount)}\n`);
s+=`Total expenses: ${fmt(t.te)}\n\nCLOSING BALANCE: ${fmt(t.close)}\n`;return s}
function copyR(){const t=reportText(mon.value);try{navigator.clipboard.writeText(t)}catch(e){}}
function msg(f){const t=totals(mon.value);return `Dear ${f.owner||'Owner'} (Flat ${f.no}),\n\n`+reportText(mon.value)+`\nThank you.`}
function sendWA(id){const f=D.flats.find(x=>x.id===id);const n=(f.wa||'').replace(/\D/g,'');window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg(f))}`,'_blank')}
function sendMail(id){const f=D.flats.find(x=>x.id===id);location.href=`mailto:${f.email||''}?subject=${encodeURIComponent('Alif Apartment – Accounts '+mon.value)}&body=${encodeURIComponent(msg(f))}`}
const sb=(window.supabase&&SUPABASE_URL)?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
async function load(){const [f,c,d,e]=await Promise.all([sb.from('flats').select('*').order('no'),ADMIN?sb.from('flat_contacts').select('*'):Promise.resolve({data:[]}),sb.from('deposits').select('*'),sb.from('expenses').select('*')]);
const er=[f,d,e].find(x=>x.error);if(er){stat='Load error: '+er.error.message;IN=true;render();return}
const cm={};(c.data||[]).forEach(x=>cm[x.flat_id]=x);
D.flats=f.data.map(x=>({id:x.id,no:x.no,owner:x.owner,monthly:+x.monthly,email:(cm[x.id]||{}).email||'',wa:(cm[x.id]||{}).wa||''}));
D.deposits=d.data.map(x=>({id:x.id,month:x.month,flat:x.flat_id,amount:+x.amount,date:x.date}));
D.expenses=e.data.map(x=>({id:x.id,month:x.month,cat:x.cat,note:x.note,amount:+x.amount,date:x.date}));IN=true;render()}
async function run(p){const r=await p;if(r.error){alert(r.error.message);return}await load()}
function addFlat(){const no=$('fn').value.trim();if(!no)return;(async()=>{const r=await sb.from('flats').insert({no,owner:$('fo').value,monthly:+$('fm').value||0}).select().single();if(r.error)return alert(r.error.message);await sb.from('flat_contacts').insert({flat_id:r.data.id,email:$('fe').value,wa:$('fw').value});await load()})()}
function addDep(){const a=+$('da').value;if(!a||!$('df').value)return;run(sb.from('deposits').insert({month:mon.value,flat_id:$('df').value,amount:a,date:$('dd').value||null}))}
function addExp(){const a=+$('ea').value;if(!a)return;run(sb.from('expenses').insert({month:mon.value,cat:$('ec').value||'Other',note:$('en').value,amount:a,date:$('ed').value||null}))}
function del(k,id){if(confirm('Delete this entry?'))run(sb.from(k).delete().eq('id',id))}
function showLogin(){IN=false;$('tabs').innerHTML='';$('st').textContent='';$('out').style.display='none';$('view').innerHTML='<div class="card" style="max-width:340px;margin:30px auto"><h2>Sign in</h2><div class="row"><input id="le" type="email" placeholder="Email" style="width:100%"></div><div class="row"><input id="lp" type="password" placeholder="Password" style="width:100%" onkeydown="if(event.key===\'Enter\')login()"></div><button class="p" onclick="login()">Sign in</button><p id="lerr" class="bad"></p></div>'}
async function login(){const r=await sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value});if(r.error){$('lerr').textContent=r.error.message;return}start()}
async function logout(){await sb.auth.signOut();ADMIN=false;D={flats:[],deposits:[],expenses:[]};showLogin()}
async function start(){if(!sb){$('view').innerHTML='<div class="card">Setup needed: paste your Supabase URL and anon key at the top of the script.</div>';return}
const {data}=await sb.auth.getSession();const session=data&&data.session;if(!session){showLogin();return}
const p=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
ADMIN=!!(p.data&&p.data.role==='admin');stat='\u00b7 '+(ADMIN?'Admin':'Owner (read-only)')+' \u00b7 '+session.user.email;
$('out').style.display='';await load()}
start();
</script></body></html>
